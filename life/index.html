<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>내 하루</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#111827;--mute:#6b7280;--line:#e5e7eb;--accent:#4f46e5;--oncle:#3b82f6;--grabit:#f97316;--ig:#d946ef;--ok:#16a34a;--bad:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0b0f17;--card:#161b26;--ink:#f3f4f6;--mute:#9ca3af;--line:#262d3b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Malgun Gothic",sans-serif;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
main{max-width:720px;margin:0 auto}
header{padding:calc(18px + env(safe-area-inset-top)) 0 8px;display:flex;justify-content:space-between;align-items:flex-end}
h1{font-size:22px;margin:0}
.sub{color:var(--mute);font-size:13px}
button{font:inherit;cursor:pointer}
.ghost{background:none;border:0;color:var(--mute);padding:6px}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card h2{font-size:14px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
.center{border-top:4px solid var(--c)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.stats b{display:block;font-size:22px}
.stats span{font-size:12px;color:var(--mute)}
.name{font-weight:700;color:var(--c);margin-bottom:8px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row .when{font-size:12px;color:var(--mute);white-space:nowrap}
.row.done .t{text-decoration:line-through;color:var(--mute)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.del{color:var(--mute);background:none;border:0;font-size:18px;padding:0 4px}
.empty{color:var(--mute);text-align:center;padding:10px 0;font-size:13px}
form.add{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
input,select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0}
form.add input[type=text]{flex:1 1 160px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--line);color:var(--mute)}
.big{font-size:30px;font-weight:800}
.warn{color:var(--bad)}.okc{color:var(--ok)}
svg.spark{width:100%;height:46px}
.post{font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
.post:last-child{border:0}
.post small{color:var(--mute)}
#login{max-width:340px;margin:18vh auto 0;text-align:center}
#login input{width:100%;margin:6px 0}
#err{color:var(--bad);font-size:13px;min-height:18px}
.hide{display:none!important}
.chips{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="login" class="hide">
  <h1>내 하루</h1><p class="sub">그랩온 · 입툭 · 일정을 한 번에</p>
  <input id="em" type="text" placeholder="아이디 (그랩온 관리자와 동일)" autocomplete="username" autocapitalize="none">
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
  <div id="err"></div>
  <button class="btn" id="go" style="width:100%">로그인</button>
</div>

<main id="app" class="hide">
  <header>
    <div><h1 id="hello">내 하루</h1><div class="sub" id="date"></div></div>
    <div><button class="ghost" id="refresh" title="새로고침">↻</button><button class="ghost" id="out">로그아웃</button></div>
  </header>

  <section class="card"><h2>오늘 일정 <span class="sub" id="cntToday"></span></h2><div id="today"></div></section>

  <section class="card"><h2>할 일</h2><div id="todos"></div>
    <form class="add" id="addTodo"><input type="text" placeholder="할 일 추가" required maxlength="200">
    <select><option>개인</option><option>그랩온</option><option>입툭</option><option>가족</option></select>
    <button class="btn">추가</button></form></section>

  <div class="grid" id="centers"></div>

  <section class="card"><h2>입툭영어 인스타 <span class="sub" id="igSub"></span></h2><div id="ig"></div></section>

  <section class="card"><h2>다가오는 일정 (14일)</h2><div id="upcoming"></div>
    <form class="add" id="addEvent"><input type="text" placeholder="일정 제목" required maxlength="200">
    <input type="datetime-local" required>
    <select><option value="none">반복 없음</option><option value="daily">매일</option><option value="weekly">매주</option><option value="monthly">매월</option></select>
    <select><option>개인</option><option>그랩온</option><option>입툭</option><option>가족</option></select>
    <button class="btn">추가</button></form></section>
  <p class="sub" style="text-align:center" id="stamp"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL="https://iknidqosbmqzgkhfaktc.supabase.co";
const SB_KEY="sb_publishable_lFAVbxnln3D2qTNpYEObPw_IrMj1dfo";
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DOW=["일","월","화","수","목","금","토"];
const CCOLOR={ONCLE:"var(--oncle)",GRABIT:"var(--grabit)"};
let items=[];

function fmtT(d){return `${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`}
function fmtD(d){return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`}
function sameDay(a,b){return a.toDateString()===b.toDateString()}
function startOfDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x}

// 반복 일정 펼치기: [from,to) 안에 들어오는 발생일 목록
function occurrences(it,from,to){
  const base=new Date(it.due_at),out=[];
  if(it.repeat==="none"){if(base>=from&&base<to)out.push(base);return out}
  let d=new Date(base),n=0;
  while(d<to&&n++<800){
    if(d>=from)out.push(new Date(d));
    if(it.repeat==="daily")d.setDate(d.getDate()+1);
    else if(it.repeat==="weekly")d.setDate(d.getDate()+7);
    else{const day=base.getDate();d=new Date(d.getFullYear(),d.getMonth()+1,day,base.getHours(),base.getMinutes())}
  }
  return out;
}
function rowEv(it,when,showDate){
  return `<div class="row"><div class="t">${esc(it.title)} <span class="tag">${esc(it.category)}${it.repeat!=="none"?" · 반복":""}</span></div>
  <div class="when">${showDate?fmtD(when)+" ":""}${it.all_day?"":fmtT(when)}</div>
  <button class="del" data-del="${it.id}" aria-label="삭제">×</button></div>`;
}
function renderLife(){
  const now=new Date(),t0=startOfDay(now),t1=new Date(t0);t1.setDate(t1.getDate()+1);
  const t14=new Date(t0);t14.setDate(t14.getDate()+14);
  const evs=items.filter(i=>i.kind==="event");
  const today=[],up=[];
  evs.forEach(e=>{
    occurrences(e,t0,t1).forEach(w=>today.push([e,w]));
    occurrences(e,t1,t14).forEach(w=>up.push([e,w]));
  });
  today.sort((a,b)=>a[1]-b[1]);up.sort((a,b)=>a[1]-b[1]);
  $("#today").innerHTML=today.length?today.map(([e,w])=>rowEv(e,w,false)).join(""):'<div class="empty">오늘은 일정이 없어요</div>';
  $("#cntToday").textContent=today.length?today.length+"건":"";
  $("#upcoming").innerHTML=up.length?up.map(([e,w])=>rowEv(e,w,true)).join(""):'<div class="empty">앞으로 2주 일정이 없어요</div>';
  const todos=items.filter(i=>i.kind==="todo").sort((a,b)=>a.done-b.done||new Date(b.created_at)-new Date(a.created_at));
  $("#todos").innerHTML=todos.length?todos.map(t=>`<div class="row ${t.done?"done":""}">
    <input type="checkbox" data-tg="${t.id}" ${t.done?"checked":""}><div class="t">${esc(t.title)} <span class="tag">${esc(t.category)}</span></div>
    <button class="del" data-del="${t.id}" aria-label="삭제">×</button></div>`).join(""):'<div class="empty">할 일이 없어요 🎉</div>';
}

function renderCenters(cs){
  $("#centers").innerHTML=cs.map(c=>`<section class="card center" style="--c:${CCOLOR[c.code]||"var(--accent)"}">
   <div class="name">${esc(c.name||c.code)}</div>
   <div class="stats"><div><b>${c.today_checkins}</b><span>오늘 출석</span></div>
   <div><b>${c.members}</b><span>유효 회원</span></div>
   <div><b class="${c.expiring_7d?"warn":""}">${c.expiring_7d}</b><span>7일내 만료</span></div></div>
   <div class="sub" style="margin-top:10px">최근 30일 신규 ${c.new_30d} · 체험 ${c.trials_30d}</div></section>`).join("");
}
function spark(h){
  if(h.length<2)return "";
  const v=h.map(x=>x.f),mn=Math.min(...v),mx=Math.max(...v),r=(mx-mn)||1;
  const pts=v.map((y,i)=>`${(i/(v.length-1))*300},${40-((y-mn)/r)*34}`).join(" ");
  return `<svg class="spark" viewBox="0 0 300 44" preserveAspectRatio="none"><polyline fill="none" stroke="var(--ig)" stroke-width="2.5" stroke-linejoin="round" points="${pts}"/></svg>`;
}
function renderIg(ig){
  const l=ig.latest||{},posts=(l.posts||[]).slice(0,4);
  const h=ig.history||[],diff=h.length>1?h[h.length-1].f-h[0].f:0;
  const nx=ig.next_at?new Date(ig.next_at):null;
  $("#igSub").innerHTML=ig.paused?'<span class="warn">⏸ 업로드 일시정지</span>':'<span class="okc">● 자동 업로드 중</span>';
  $("#ig").innerHTML=`<div style="display:flex;gap:16px;align-items:flex-end">
    <div><div class="big">${l.followers??"-"}</div><div class="sub">팔로워 <span class="${diff<0?"warn":"okc"}">${diff>=0?"+":""}${diff}</span> (2주)</div></div>
    <div style="flex:1">${spark(h)}</div></div>
    <div class="sub" style="margin:8px 0">게시물 ${l.media_count??"-"} · 대기 ${ig.queued}건${ig.failed?` · <span class="warn">실패/보류 ${ig.failed}</span>`:""}${nx?` · 다음 ${fmtD(nx)} ${fmtT(nx)}`:""}</div>
    ${posts.map(p=>`<div class="post">${esc(p.title||"(제목 없음)")}<br><small>${p.type} · 조회 ${p.views??0} · 도달 ${p.reach??0} · 저장 ${p.saved??0}</small></div>`).join("")||'<div class="empty">아직 데이터가 없어요</div>'}`;
}

async function loadLife(){
  const {data,error}=await sb.from("life_items").select("*").order("due_at",{ascending:true,nullsFirst:false});
  if(!error){items=data;renderLife()}
}
async function loadDash(){
  const {data,error}=await sb.rpc("dash_summary");
  if(error){$("#centers").innerHTML=`<section class="card"><div class="empty">그랩온 정보를 불러오지 못했어요 (${esc(error.message)})</div></section>`;$("#ig").innerHTML='<div class="empty">불러오지 못했어요</div>';return}
  renderCenters(data.centers);renderIg(data.ig);
}
async function loadAll(){
  await Promise.all([loadLife(),loadDash()]);
  const n=new Date();$("#stamp").textContent=`업데이트 ${fmtT(n)}`;
}

function show(authed){
  $("#login").classList.toggle("hide",authed);$("#app").classList.toggle("hide",!authed);
  if(authed){const n=new Date(),h=n.getHours();
    $("#hello").textContent=h<12?"좋은 아침이에요 ☀️":h<18?"오후도 힘내요 🙌":"오늘도 수고했어요 🌙";
    $("#date").textContent=`${n.getFullYear()}년 ${n.getMonth()+1}월 ${n.getDate()}일 ${DOW[n.getDay()]}요일`;loadAll()}
}
$("#go").onclick=async()=>{
  $("#err").textContent="";
  let id=$("#em").value.trim();if(id&&!id.includes("@"))id+="@oncle.local";
  const {error}=await sb.auth.signInWithPassword({email:id,password:$("#pw").value});
  if(error)$("#err").textContent="이메일 또는 비밀번호를 확인해주세요";else show(true);
};
$("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("#go").click()});
$("#out").onclick=async()=>{await sb.auth.signOut({scope:"local"});items=[];show(false)};
$("#refresh").onclick=loadAll;

$("#addTodo").onsubmit=async e=>{e.preventDefault();const f=e.target;
  const {error}=await sb.from("life_items").insert({kind:"todo",title:f[0].value.trim(),category:f[1].value});
  if(!error){f[0].value="";loadLife()}};
$("#addEvent").onsubmit=async e=>{e.preventDefault();const f=e.target;
  const {error}=await sb.from("life_items").insert({kind:"event",title:f[0].value.trim(),due_at:new Date(f[1].value).toISOString(),repeat:f[2].value,category:f[3].value});
  if(!error){f[0].value="";loadLife()}};
document.addEventListener("click",async e=>{
  const d=e.target.closest("[data-del]");
  if(d){if(confirm("삭제할까요?")){await sb.from("life_items").delete().eq("id",d.dataset.del);loadLife()}return}
});
document.addEventListener("change",async e=>{
  const t=e.target.dataset.tg;if(!t)return;
  await sb.from("life_items").update({done:e.target.checked}).eq("id",t);loadLife();
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!$("#app").classList.contains("hide"))loadAll()});
setInterval(()=>{if(!document.hidden&&!$("#app").classList.contains("hide"))loadAll()},5*60*1000);

sb.auth.getSession().then(({data})=>show(!!data.session));
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
